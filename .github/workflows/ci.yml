name: CI

on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:
    branches: [master, main]

jobs:
  python-tests:
    name: Python (unittest + compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install core dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q scripts tests

      - name: Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  node-tests:
    name: Node (tsc typecheck + TS/JS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck (src + tests)
        run: npx tsc --noEmit

      - name: Compile & run TypeScript tests
        run: npm run test:ts

      - name: Bridge JS syntax check
        run: |
          node --check scripts/bridge/watch_chatcut.js
          node --check scripts/bridge/timeline_sanitizer.js
          node --check scripts/bridge/chatcut_to_timeline.js
          node --check scripts/bridge/timeline_to_chatcut.js
          node --check tests/test_bridge.js

      - name: Bridge integration tests
        run: npm run test:bridge
